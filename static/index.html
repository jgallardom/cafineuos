<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#146c54" />
  <title>Cafineuos</title>
  <link rel="manifest" href="/static/manifest.webmanifest" />
  <link rel="stylesheet" href="/static/styles.css?v=9" />
</head>
<body>
  <div id="app">
    <header id="top"></header>
    <div id="notice" hidden></div>
    <main id="main"></main>
  </div>
  <script>
    window.addEventListener("error", (event) => {
      const note = document.getElementById("notice");
      if (!note) return;
      note.hidden = false;
      note.textContent = event.message;
    });
  </script>
  <script src="/static/app.js?v=9"></script>
</body>
</html>
